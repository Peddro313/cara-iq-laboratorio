name: cara_iq_laboratorio
description: Cara IQ Laboratório - Original facial analysis app with scoring and progress tracking.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & State
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Media & Camera
  image_picker: ^1.1.2
  camera: ^0.11.0+2
  image: ^4.2.0

  # Charts & Visuals
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1

  # Backend (to be configured)
  supabase_flutter: ^2.5.6

  # Utils
  intl: ^0.19.0
  path_provider: ^2.1.3
  shared_preferences: ^2.3.2
  uuid: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/guides/

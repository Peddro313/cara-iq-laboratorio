name: cara_iq_laboratorio
description: Cara IQ Laboratório - Original facial analysis app with scoring and progress tracking.
publish_to: 'none'
version: 0.3.0+3

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  image_picker: ^1.1.2
  google_mlkit_face_detection: ^0.12.0

  fl_chart: ^0.68.0
  google_fonts: ^6.2.1

  intl: ^0.19.0
  shared_preferences: ^2.3.2
  uuid: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/guides/
    - assets/examples/
